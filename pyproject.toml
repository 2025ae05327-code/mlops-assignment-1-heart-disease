[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-mlops"
version = "1.0.0"
description = "Reproducible Heart Disease UCI training and serving pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "joblib==1.4.2",
    "matplotlib==3.9.3",
    "mlflow==2.19.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "prometheus-client==0.21.1",
    "pydantic==2.10.4",
    "requests==2.32.3",
    "scikit-learn==1.6.0",
    "seaborn==0.13.2",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "python-docx==1.1.2",
    "ruff==0.8.4",
]

[project.scripts]
heart-download = "heart_disease_mlops.data:main"
heart-eda = "heart_disease_mlops.eda:main"
heart-train = "heart_disease_mlops.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["heart_disease_mlops"]
