name: Heart Disease MLOps CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heart-mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-train-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install reproducible environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit and integration tests
        run: pytest -q --cov=heart_disease_mlops --cov-report=term-missing --cov-report=xml --junitxml=artifacts/test-results.xml

      - name: Acquire and clean UCI data
        run: python -m heart_disease_mlops.data

      - name: Generate EDA artifacts
        run: python -m heart_disease_mlops.eda

      - name: Train, track, and package both models
        run: python -m heart_disease_mlops.train --quick --cv-folds 3 --n-jobs 2

      - name: Build final DOCX report
        env:
          STUDENT_NAME: Pawan Sharma
          STUDENT_ID: 2025AE05327
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: python scripts/build_report.py

      - name: Build serving image
        run: docker build --tag assignment1-heart-api:${{ github.sha }} .

      - name: Write workflow summary
        if: always()
        run: |
          echo "## Heart Disease MLOps run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint, tests, data, EDA, two-model training, report, and image build are enforced in order." >> "$GITHUB_STEP_SUMMARY"
          echo "- Download the evidence bundle from workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-evidence-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/
            data/processed/
            docs/Heart_Disease_MLOps_Report.docx
            models/
            mlruns/
            coverage.xml
