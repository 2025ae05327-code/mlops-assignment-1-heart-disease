apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-disease
  labels:
    app: heart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: assignment1-heart-api:1.0.0
          imagePullPolicy: Never
          env:
            - name: MODEL_PATH
              value: /app/models/heart_disease_pipeline.joblib
            - name: MODEL_METADATA_PATH
              value: /app/models/model_metadata.json
            - name: PREDICTION_THRESHOLD
              value: "0.5"
            - name: LOG_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-disease
  labels:
    app: heart-api
spec:
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - name: http
      port: 80
      targetPort: http
